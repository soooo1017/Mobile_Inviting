<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>비밀번호 재설정</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --canvas: #f4f2ef;
    --surface: #ffffff;
    --ink: #23212a;
    --muted: #7a7580;
    --accent: #5f5486;
    --accent-tint: #efedfd;
    --line: #e5dfd6;
    --error: #a04a4a;
    --error-tint: #f6ecea;
    --success: #3f6b4f;
    --success-tint: #e8f1ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px;
    background: var(--canvas);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border-radius: 16px;
    padding: 32px 24px;
    box-shadow: 0 10px 30px rgba(35, 33, 42, 0.08);
  }
  .icon {
    width: 48px;
    height: 48px;
    border-radius: 999px;
    background: var(--accent-tint);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .icon.error { background: var(--error-tint); color: var(--error); }
  .icon.success { background: var(--success-tint); color: var(--success); }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 8px;
  }
  p.desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #4f4b56;
    margin-bottom: 6px;
  }
  .field { margin-bottom: 16px; }
  input[type="password"] {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    background: var(--surface);
    color: var(--ink);
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--ink);
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  .error-text {
    font-size: 12.5px;
    color: var(--error);
    margin-top: 6px;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--ink);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled {
    opacity: 0.45;
    cursor: default;
  }
  .loading { color: var(--muted); font-size: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div id="state-loading">
      <div class="icon">⋯</div>
      <h1>확인 중이에요</h1>
      <p class="desc loading">잠시만 기다려주세요.</p>
    </div>

    <div id="state-form" class="hidden">
      <div class="icon">🔒</div>
      <h1>새 비밀번호 설정</h1>
      <p class="desc">계정에 사용할 새 비밀번호를 입력해주세요.</p>
      <form id="reset-form">
        <div class="field">
          <label for="password">새 비밀번호</label>
          <input id="password" type="password" autocomplete="new-password" placeholder="8자 이상 입력해주세요" />
          <div class="hint">영문, 숫자를 포함해 8자 이상으로 설정해주세요.</div>
        </div>
        <div class="field">
          <label for="confirm">새 비밀번호 확인</label>
          <input id="confirm" type="password" autocomplete="new-password" placeholder="새 비밀번호를 다시 입력해주세요" />
          <div id="match-error" class="error-text hidden">새 비밀번호가 서로 달라요.</div>
        </div>
        <div id="submit-error" class="error-text hidden"></div>
        <button id="submit-btn" type="submit">비밀번호 재설정</button>
      </form>
    </div>

    <div id="state-success" class="hidden">
      <div class="icon success">✓</div>
      <h1>비밀번호를 변경했어요</h1>
      <p class="desc">이제 앱으로 돌아가서 새 비밀번호로 로그인해주세요. 이 창은 닫으셔도 돼요.</p>
    </div>

    <div id="state-error" class="hidden">
      <div class="icon error">!</div>
      <h1>유효하지 않은 링크예요</h1>
      <p class="desc" id="error-desc">
        이 링크가 만료되었거나 이미 사용됐어요. 앱의 "비밀번호 찾기"에서 다시 요청해주세요.
      </p>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/+esm';

    const SUPABASE_URL = 'https://yaiqsiyrpzolvktjptws.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tjXee853EZyWE2G6ZsxcAw_EIBGVuJ7';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const show = (id) => {
      ['state-loading', 'state-form', 'state-success', 'state-error'].forEach((s) => {
        document.getElementById(s).classList.toggle('hidden', s !== id);
      });
    };

    const urlError = new URLSearchParams(window.location.hash.replace('#', '?')).get('error_description')
      || new URLSearchParams(window.location.search).get('error_description');
    if (urlError) {
      document.getElementById('error-desc').textContent = decodeURIComponent(urlError.replace(/\+/g, ' '));
      show('state-error');
    } else {
      let resolved = false;
      const settle = (hasRecoverySession) => {
        if (resolved) return;
        resolved = true;
        show(hasRecoverySession ? 'state-form' : 'state-error');
      };

      supabase.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') settle(true);
      });

      // Fallback in case the event already fired before the listener attached,
      // or this is a plain reload of the page with an existing recovery session.
      setTimeout(async () => {
        const { data } = await supabase.auth.getSession();
        settle(Boolean(data.session));
      }, 1500);
    }

    const form = document.getElementById('reset-form');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');
    const matchError = document.getElementById('match-error');
    const submitError = document.getElementById('submit-error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      matchError.classList.add('hidden');
      submitError.classList.add('hidden');

      const password = passwordInput.value;
      const confirm = confirmInput.value;

      if (password.length < 8) {
        submitError.textContent = '비밀번호는 8자 이상이어야 해요.';
        submitError.classList.remove('hidden');
        return;
      }
      if (password !== confirm) {
        matchError.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '변경하는 중...';

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = '비밀번호 재설정';
        submitError.textContent = '비밀번호를 변경하지 못했어요. 다시 시도해주세요.';
        submitError.classList.remove('hidden');
        return;
      }

      await supabase.auth.signOut();
      show('state-success');
    });
  </script>
</body>
</html>
