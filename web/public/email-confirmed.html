<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>이메일 인증 완료</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --canvas: #f4f2ef;
    --surface: #ffffff;
    --ink: #23212a;
    --muted: #7a7580;
    --accent: #5f5486;
    --accent-tint: #efedfd;
    --line: #e5dfd6;
    --error: #a04a4a;
    --error-tint: #f6ecea;
    --success: #3f6b4f;
    --success-tint: #e8f1ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px;
    background: var(--canvas);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border-radius: 16px;
    padding: 32px 24px;
    box-shadow: 0 10px 30px rgba(35, 33, 42, 0.08);
  }
  .icon {
    width: 48px;
    height: 48px;
    border-radius: 999px;
    background: var(--accent-tint);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .icon.error { background: var(--error-tint); color: var(--error); }
  .icon.success { background: var(--success-tint); color: var(--success); }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 8px;
  }
  p.desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #4f4b56;
    margin-bottom: 6px;
  }
  .field { margin-bottom: 16px; }
  input[type="password"] {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    background: var(--surface);
    color: var(--ink);
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--ink);
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  .error-text {
    font-size: 12.5px;
    color: var(--error);
    margin-top: 6px;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--ink);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled {
    opacity: 0.45;
    cursor: default;
  }
  .loading { color: var(--muted); font-size: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon success">✓</div>
    <h1>이메일 인증이 끝났어요</h1>
    <p class="desc">이제 모이소 앱으로 돌아가서 로그인해 주세요. 이 창은 닫으셔도 돼요.</p>
  </div>
</body>
</html>
